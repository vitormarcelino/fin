# Production stack: pre-built app image (pulled, not built here) + Postgres.
#
# Usage:
#   cp .env.production.example .env   # fill in real secrets
#   docker compose -f docker-compose.prod.yml pull app
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml run --rm migrate
#
# No --env-file flag needed: Compose loads ./.env by default and uses it to
# resolve the ${...} substitutions below (env_file: on a service only
# injects vars into that container, it does not feed compose's own variable
# substitution — so it's not used here).
#
# Both `app` and `migrate` only reference an image (DOCKER_IMAGE:IMAGE_TAG) —
# it must already be built and pushed (e.g. by CI) before `up`/`run`. No
# source checkout is needed on this host: the image itself carries what
# `lib/db/migrate.ts` needs (tsx, drizzle-orm, postgres — see Dockerfile's
# `migrate-deps` stage) alongside the app.
#
# This is a separate project ("fin-prod") from docker-compose.yml's dev
# Postgres ("fin"), so the two stacks don't collide on container/volume names
# if both happen to run on the same host. Run this stack on a host with its
# own ./.env holding the production values — don't mix it with a dev checkout.
name: fin-prod

services:
  app:
    image: ${DOCKER_IMAGE:-us-east1-docker.pkg.dev/vitormarcelino/fin/app}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/fin
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-fin_session}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?set PASSWORD_PEPPER in .env}
    ports:
      - "${APP_PORT:-3000}:3000"
    # HEALTHCHECK is already baked into the image (see Dockerfile).

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fin
    volumes:
      - fin_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin -d fin"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port published in prod — only `app`/`migrate` reach it, over
    # the compose network. For ad-hoc access use:
    #   docker compose -f docker-compose.prod.yml exec postgres psql -U fin fin

  # One-off migration runner, same image as `app`. Not part of `up` (profile
  # gated) — run explicitly:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    image: ${DOCKER_IMAGE:-us-east1-docker.pkg.dev/vitormarcelino/fin/app}:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/fin
    command: ["npx", "tsx", "lib/db/migrate.ts"]

volumes:
  fin_prod_postgres_data:
