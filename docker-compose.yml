services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: fin
      POSTGRES_DB: fin
    ports:
      - '5433:5432'
    volumes:
      - fin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fin -d fin']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fin_postgres_data:
